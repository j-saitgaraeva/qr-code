<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.8.0/lib/qr-code-styling.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1 class="title">Генератор QR-кодов</h1>
    
    <!-- ✅ ИНПУТ С КРЕСТИКОМ -->
    <div class="input-wrapper">
      <div class="field">
        <input type="text" id="url-input" placeholder="Вставьте ссылку">
      </div>
      <button id="clear-btn" class="clear-btn" title="Очистить">×</button>
    </div>
    
    <button id="download-btn" class="btn">Скачать</button>
    
    <div class="preview-wrapper">
      <div class="qr-container">
        <div id="qr-container"></div>
      </div>
      <div class="hint">
        Формат PNG · Прозрачный фон · Цвет #222222 · Уровень коррекции ошибок H
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
